name: FouFou
options:
  bundleIdPrefix: jp.foufou
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  FouFou:
    type: application
    platform: iOS
    sources:
      - path: FouFou
        excludes:
          - "Info.plist"
    info:
      path: FouFou/Info.plist
      properties:
        CFBundleDisplayName: FouFou
        CFBundleName: FouFou
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        API_BASE_URL: $(API_BASE_URL)
        WEB_BASE_URL: $(WEB_BASE_URL)
        FIREBASE_API_KEY: $(FIREBASE_API_KEY)
        FIREBASE_STORAGE_BUCKET: $(FIREBASE_STORAGE_BUCKET)
        GOOGLE_IOS_CLIENT_ID: $(GOOGLE_IOS_CLIENT_ID)
        NSPhotoLibraryUsageDescription: 旅行の写真を共有するためにフォトライブラリを使用します。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.foufou.ios
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
